<!doctype html>
<html lang="lt"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>GruZExpert – užsakymai</title><link rel="stylesheet" href="styles.css"/><style>body{background:#f3f1ec}.admin{max-width:1060px;margin:70px auto;padding:0 24px}.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.admin h1{font:600 38px var(--display);text-transform:uppercase;margin:0}.admin-login{background:#fff;padding:25px;max-width:450px;box-shadow:0 5px 25px #0001}.admin-login label{display:grid;gap:7px;font-size:12px;font-weight:800}.admin-login input{padding:12px;border:1px solid #d8d4cc}.admin-login button{margin-top:14px}.orders{display:grid;gap:14px}.order{background:#fff;border-left:5px solid var(--yellow);padding:22px;box-shadow:0 3px 12px #0000000d}.order-top{display:flex;gap:15px;justify-content:space-between;align-items:start}.order h2{margin:0;font-size:18px}.order time,.order p{font-size:12px;color:#666}.order-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.order-grid div{font-size:12px}.order-grid b{display:block;color:#777;font-size:10px;text-transform:uppercase;margin-bottom:2px}.delete{border:0;background:#f8e5e5;color:#a22121;padding:8px 11px;font-size:11px;font-weight:800;cursor:pointer}.notice{margin:14px 0;font-size:13px}@media(max-width:600px){.admin{margin:35px auto}.order-grid{grid-template-columns:1fr 1fr}.admin h1{font-size:30px}}</style></head>
<body><main class="admin"><div class="admin-head"><a class="brand" href="index.html"><span class="brand-mark"><i></i><b></b></span><span class="brand-name"><small>MB</small>GruZ<span>Expert</span></span></a><a class="button button-small" href="index.html">← Į svetainę</a></div><h1>Užsakymų valdymas</h1><p class="notice">Šis puslapis skirtas tik įmonės administratoriui.</p><section id="login" class="admin-login"><label>Administratoriaus raktas<input id="key" type="password" autocomplete="current-password" required></label><button class="button" id="login-button">Atidaryti užsakymus</button><p class="form-status" id="login-status"></p></section><section id="order-list" class="orders" hidden></section></main><script>
const keyInput=document.getElementById('key'), login=document.getElementById('login'), list=document.getElementById('order-list'), status=document.getElementById('login-status');
let adminKey=sessionStorage.getItem('gruzexpert-admin-key')||'';
async function loadOrders(){const r=await fetch('/api/orders',{headers:{'X-Admin-Key':adminKey}});if(!r.ok)throw new Error();const orders=await r.json();login.hidden=true;list.hidden=false;list.innerHTML=orders.length?orders.map(o=>`<article class="order"><div class="order-top"><div><h2>${escapeHtml(o.name)}</h2><time>${new Date(o.createdAt).toLocaleString()}</time></div><button class="delete" data-id="${o.id}">Ištrinti</button></div><div class="order-grid"><div><b>Iš kur</b>${escapeHtml(o.from)}</div><div><b>Į kur</b>${escapeHtml(o.to)}</div><div><b>Tarifas</b>${escapeHtml(o.tariff)}</div><div><b>Telefonas</b>${escapeHtml(o.phone)}</div><div><b>El. paštas</b>${escapeHtml(o.email)}</div><div><b>Data</b>${escapeHtml(o.date||'—')}</div><div><b>Liftas paėmime</b>${escapeHtml(o.pickupLift)}</div><div><b>Liftas pristatyme</b>${escapeHtml(o.deliveryLift)}</div><div><b>Kalba</b>${escapeHtml(o.language)}</div></div>${o.details?`<p><b>Pastabos:</b> ${escapeHtml(o.details)}</p>`:''}</article>`).join(''):'<p>Užsakymų dar nėra.</p>';}
function escapeHtml(v){return String(v||'—').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
document.getElementById('login-button').onclick=async()=>{adminKey=keyInput.value;try{await loadOrders();sessionStorage.setItem('gruzexpert-admin-key',adminKey)}catch{status.className='form-status error';status.textContent='Neteisingas raktas arba serveris nepasiekiamas.'}};
list.onclick=async e=>{if(!e.target.matches('.delete'))return;if(!confirm('Ištrinti šią užklausą?'))return;const r=await fetch('/api/orders/'+e.target.dataset.id,{method:'DELETE',headers:{'X-Admin-Key':adminKey}});if(r.ok)loadOrders();else alert('Nepavyko ištrinti užsakymo.');};if(adminKey)loadOrders().catch(()=>sessionStorage.removeItem('gruzexpert-admin-key'));
</script></body></html>
